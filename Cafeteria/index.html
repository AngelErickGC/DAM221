<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cafetería</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #000;
        }
        
        h1 { font-size: 20px; }
        h2 { font-size: 16px; }
        h3 { font-size: 14px; }
        
        /* Navegación */
        .nav {
            margin-bottom: 20px;
        }
        .nav button {
            padding: 5px 10px;
            margin-right: 5px;
            cursor: pointer;
        }
        
        /* Vistas */
        .vista { display: none; }
        .vista.active { display: block; }
        
        /* Paneles */
        .panel {
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        /* Inputs */
        input {
            padding: 5px;
            margin: 5px 0;
            width: 200px;
        }
        
        /* Botones */
        button {
            padding: 5px 10px;
            cursor: pointer;
        }
        
        /* Listas */
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            border-bottom: 1px solid #ccc;
            padding: 5px 0;
        }
        
        /* Productos */
        .producto {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
        }
        
        /* Total */
        .total {
            font-weight: bold;
            margin-top: 10px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            margin: 100px auto;
            width: 300px;
            border: 1px solid #000;
            text-align: center;
        }
        
        /* Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #000;
            color: #fff;
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Cafetería Central</h1>

    <!-- Navegación -->
    <div class="nav">
        <button onclick="cambiarVista('cocina', this)">Cocina</button>
        <button onclick="cambiarVista('cliente', this)">Cliente</button>
        <button onclick="cambiarVista('caja', this)">Caja</button>
    </div>

    <!-- Vista Cocina -->
    <div id="vista-cocina" class="vista active">
        <div class="panel">
            <h2>Cocina - Productos</h2>
            
            <h3>Agregar Producto</h3>
            <input type="text" id="crudNombre" placeholder="Nombre">
            <input type="number" id="crudPrecio" placeholder="Precio">
            <button onclick="agregarProducto()">Agregar</button>

            <h3>Lista de Productos</h3>
            <div id="listaProductosCrud">
                <p>No hay productos.</p>
            </div>
        </div>
    </div>

    <!-- Vista Cliente -->
    <div id="vista-cliente" class="vista">
        <div class="panel">
            <h2>Cliente - Menú</h2>
            <div id="gridProductosCliente">
                <p>No hay productos.</p>
            </div>

            <h3>Tu Pedido</h3>
            <div id="listaCliente">
                <p>Sin productos.</p>
            </div>
            <div class="total">
                Total: $<span id="totalCliente">0.00</span>
            </div>
            <button onclick="confirmarPedidoCliente()">Confirmar Pedido</button>
        </div>
    </div>

    <!-- Vista Caja -->
    <div id="vista-caja" class="vista">
        <div class="panel">
            <h2>Caja</h2>
            
            <input type="text" id="producto" placeholder="Producto">
            <input type="number" id="precio" placeholder="Precio">
            <button onclick="agregarPedido()">Añadir</button>
            <button onclick="cerrarPedido()">Cobrar</button>

            <h3>Ticket Actual</h3>
            <div id="listaActual">
                <p>Sin productos.</p>
            </div>
            <div class="total">
                Total: $<span id="totalActual">0.00</span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modalTicket">
        <div class="modal-content">
            <h3>Pedido Confirmado</h3>
            <p>Tu número:</p>
            <h2 id="numeroTicket">#001</h2>
            <button onclick="cerrarModalTicket()">Cerrar</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="cocina.js"></script>
    <script src="cliente.js"></script>
    <script src="caja.js"></script>
    <script src="main.js"></script>

</body>
</html>
